[project]
name = "my-own-agent"
version = "0.1.0"
description = "A composable, plugin-based agent runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=3.8.0",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic>=2.13.5",
]

[project.scripts]
my-own-agent = "my_own_agent:main"

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    ".env.example",
    ".python-version",
    "AGENTS.md",
    "CHANGELOG.md",
    "agent.example.toml",
    "docs/**",
    "examples/**",
    "start.sh",
    "tests/**",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
check_untyped_defs = true
strict = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "types-jsonschema>=4.26.0.20260518",
]
